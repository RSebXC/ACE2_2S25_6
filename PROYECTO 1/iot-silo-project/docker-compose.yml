version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hydroguard_postgres
    environment:
      POSTGRES_DB: hydroguard
      POSTGRES_USER: hydroguard_user
      POSTGRES_PASSWORD: hydroguard_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database-init:/docker-entrypoint-initdb.d/
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: hydroguard_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: hydroguard_backend
    depends_on:
      - postgres
      - mosquitto
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data: